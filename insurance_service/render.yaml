databases:
  - name: insurance-db
    plan: free
    databaseName: insurance_db
    user: insurance_user

services:
  - type: web
    name: insurance-service
    runtime: python
    plan: free
    buildCommand: "bash insurance_service/build.sh"
    startCommand: "uvicorn insurance_service.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: "https://your-frontend-url.netlify.app"
      - key: PYTHON_VERSION
        value: "3.13.0"
