[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to the Render backend (avoids CORS issues)
# Replace YOUR_RENDER_SERVICE_URL with your actual Render backend URL
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_SERVICE_URL.onrender.com/:splat"
  status = 200
  force = true

# SPA client-side routing fallback (must come AFTER the API proxy)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
